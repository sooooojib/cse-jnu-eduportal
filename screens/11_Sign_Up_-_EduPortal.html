<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .role-radio:checked + label {
            background-color: var(--tw-colors-student-bg, #ecfdf5);
            border-color: var(--tw-colors-primary, #006948);
            color: var(--tw-colors-primary, #006948);
        }

<style type="text/css"></style><style type="text/css"></style><style type="text/css"></style></head>
<body class="bg-background min-h-screen flex flex-col font-sans text-on-background relative overflow-x-hidden">
<!-- Top Navigation (Shell logic: Suppressed for Auth flow, but keeping a minimal header for brand) -->
<header class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 w-full z-50 bg-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">shield</span>
<span class="font-headline-md text-headline-md font-bold text-primary">JnU EduPortal</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-4 sm:p-6 w-full relative z-10">
<!-- Auth Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden border border-surface-variant relative">
<!-- Emerald Glow Accent -->
<div class="absolute -top-10 -right-10 w-40 h-40 bg-emerald-600 rounded-full blur-[60px] opacity-20 pointer-events-none"></div>
<div class="p-8 sm:p-10 relative z-10">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-background mb-2">Create an account</h1>
<p class="font-body-lg text-body-lg text-secondary">Get started today.</p>
</div>
<!-- Registration Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Account Type Selection -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface">Account Type</label>
<div class="grid grid-cols-3 gap-2">
<div>
<input checked="" class="peer sr-only role-radio" id="role-student" name="account-type" onchange="updateIdLabel()" type="radio" value="student">
<label class="flex flex-col items-center justify-center h-input-height rounded-full border border-outline-variant text-secondary cursor-pointer transition-all hover:bg-surface-container font-label-md text-label-md" for="role-student">
                                    Student
                                </label>
</div>
<div>
<input class="peer sr-only role-radio" id="role-teacher" name="account-type" onchange="updateIdLabel()" type="radio" value="teacher">
<label class="flex flex-col items-center justify-center h-input-height rounded-full border border-outline-variant text-secondary cursor-pointer transition-all hover:bg-surface-container font-label-md text-label-md" for="role-teacher">
                                    Teacher
                                </label>
</div>
<div>
<input class="peer sr-only role-radio" id="role-cr" name="account-type" onchange="updateIdLabel()" type="radio" value="cr">
<label class="flex flex-col items-center justify-center h-input-height rounded-full border border-outline-variant text-secondary cursor-pointer transition-all hover:bg-surface-container font-label-md text-label-md" for="role-cr">
                                    CR
                                </label>
</div>
</div>
</div>
<!-- Full Name -->
<div class="space-y-2 relative">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary">person</span>
<input class="w-full h-input-height pl-12 pr-4 rounded-full glass-panel border-outline-variant text-on-surface font-auth-input text-auth-input focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-colors bg-white/70" id="fullName" placeholder="John Doe" required="" type="text">
</div>
</div>
<!-- Role Specific ID -->
<div class="space-y-2 relative">
<label class="font-label-md text-label-md text-on-surface" for="roleId" id="idLabel">Student ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary" id="idIcon">badge</span>
<input class="w-full h-input-height pl-12 pr-4 rounded-full glass-panel border-outline-variant text-on-surface font-auth-input text-auth-input focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-colors bg-white/70" id="roleId" placeholder="e.g. B210305..." required="" type="text">
</div>
</div>
<!-- Email Address -->
<div class="space-y-2 relative">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary">mail</span>
<input class="w-full h-input-height pl-12 pr-4 rounded-full glass-panel border-outline-variant text-on-surface font-auth-input text-auth-input focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-colors bg-white/70" id="email" placeholder="you@student.jnu.ac.bd" required="" type="email">
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-input-height bg-primary text-on-primary rounded-full font-label-md text-label-md hover:bg-primary-container transition-colors shadow-sm flex items-center justify-center gap-2 mt-6" type="submit">
                        Submit Request
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Features List -->

<!-- Footer Link -->
<div class="text-center mt-6">
<p class="font-body-sm text-body-sm text-secondary">
                        Already have an account? 
                        <a class="text-primary font-label-md hover:underline hover:text-primary-container transition-colors" href="#">Log in</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer Component from JSON (Mandatory inclusion based on instructions, though contextually a bit weird on a mobile auth screen, following JSON anchor logic) -->
<footer class="w-full py-8 flex flex-col md:flex-row justify-center items-center gap-4 mt-auto bg-transparent relative z-10 flat no shadows">
<span class="font-body-sm text-body-sm text-secondary dark:text-secondary-fixed-dim">© 2024 Department of CSE, Jagannath University</span>
<div class="flex gap-4">
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-inverse-primary transition-colors Opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-inverse-primary transition-colors Opacity-80 hover:opacity-100" href="#">Academic Calendar</a>
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-inverse-primary transition-colors Opacity-80 hover:opacity-100" href="#">Contact Support</a>
</div>
</footer>
<!-- Interactive Logic -->
<script>
        function updateIdLabel() {
            const role = document.querySelector('input[name="account-type"]:checked').value;
            const labelEl = document.getElementById('idLabel');
            const iconEl = document.getElementById('idIcon');
            const inputEl = document.getElementById('roleId');

            if (role === 'teacher') {
                labelEl.textContent = 'Phone Number';
                iconEl.textContent = 'phone';
                inputEl.placeholder = 'e.g. +8801...';
                inputEl.type = 'tel';
            } else {
                labelEl.textContent = 'Student ID';
                iconEl.textContent = 'badge';
                inputEl.placeholder = 'e.g. B210305...';
                inputEl.type = 'text';
            }
        }
    </script>




</body></html>
