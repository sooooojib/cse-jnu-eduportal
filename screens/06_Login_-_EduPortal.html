<body class="bg-canvas-gray min-h-screen flex items-center justify-center font-body-sm text-body-sm text-on-surface antialiased">
<!-- Decorative background elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-40 -right-40 w-96 h-96 bg-primary/10 rounded-full blur-3xl"></div>
<div class="absolute -bottom-40 -left-40 w-96 h-96 bg-inverse-primary/10 rounded-full blur-3xl"></div>
</div>
<!-- Main Mobile Container -->
<main class="w-full max-w-[400px] h-[800px] max-h-screen bg-canvas-gray relative flex flex-col justify-end overflow-hidden sm:rounded-[3rem] shadow-2xl z-10">
<!-- Header Illustration Area (Top) -->
<div class="absolute top-0 left-0 w-full h-[40%] bg-gradient-to-b from-primary/5 to-transparent flex items-center justify-center p-8">
<div class="bg-contain bg-center bg-no-repeat w-full h-full opacity-80" data-alt="A clean, minimalist 3d illustration of an academic workspace. A sleek laptop, a steaming cup of coffee, and some scattered notebooks on a modern desk. Soft, warm lighting creates a welcoming educational atmosphere. The color palette incorporates subtle emerald greens and pristine whites against a neutral background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCWcPG5g340GFj7TT5IhwpDoDnXPEwoV0bjhy8_AOT_UpvrJIbSUFeFicTa7PPlEzvbqgn3u8yhcwop_9Xnw2XlDLFi-3QnrGwXgqKQNGXuDs8JVMQ_HRGUEXuZrHnLzKZUTYuDUPOSfoEuKkirQQcvFgwg8FfKDVMOfBNotZz-NJNv4YtBo-lyk-9kNjoaZCA3PN2BYTA-uP8iJgYTvz2Se_bM-anl5H9prAtC-OQL5TFxkEIJ6-NBKQ')"></div>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest w-full h-[75%] rounded-t-[2.5rem] p-8 flex flex-col relative z-20 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
<!-- Logo Pill -->
<div class="inline-flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full mb-6 self-start">
<span class="material-symbols-outlined text-primary text-lg" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-label-md text-label-md text-primary">JnU EduPortal</span>
</div>
<!-- Headings -->
<div class="mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Log in to Portal</h1>
<p class="font-body-lg text-body-lg text-secondary">Welcome back! Enter details</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5 flex-grow">
<!-- Email Input -->
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary">mail</span>
<input class="w-full h-input-height pl-12 pr-4 bg-surface rounded-full border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-auth-input text-auth-input text-on-surface placeholder:text-secondary-fixed-dim" placeholder="Email address" required="" type="email">
</div>
<!-- Password Input -->
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary">lock</span>
<input class="w-full h-input-height pl-12 pr-12 bg-surface rounded-full border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-auth-input text-auth-input text-on-surface placeholder:text-secondary-fixed-dim tracking-[0.3em]" placeholder="Password" required="" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-1 mb-2">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-full flex items-center justify-center gap-2 transition-all shadow-md hover:shadow-lg mt-auto" type="submit">
                    Sign In
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-secondary">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
</main>
