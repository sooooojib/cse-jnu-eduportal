name: cse_jnu_eduportal
description: "CSE JnU EduPortal - Next-Generation Academic Mobile Ecosystem"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Firebase SDK
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.4
  firebase_app_check: ^0.3.1+4
  firebase_crashlytics: ^4.1.4
  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  # UI & utilities
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  get_it: ^8.0.3
  equatable: ^2.0.7
  logger: ^2.5.0
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

